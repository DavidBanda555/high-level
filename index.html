<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Level — The Plan</title>
<!--
  Full plan for High Level, tabbed "folder sheet" UI (swipe + buttons).
  Tabs: The Plan · How We Work · Plan of Work · To-Do List · HQ Checklist · Questions to Discuss.
  Convention: concept/positioning content uses role labels only (no names).
  Names appear only on actual task/action assignments, per instruction.
  Mirrors projects/high-level/*.md — this is the read-only, shareable version.
  Design pass: two-role type system (Fraunces display / Inter body), literal folder-tab shapes
  with a sliding position rail, layered shadow depth, reduced-motion + focus-visible honored
  per library/web-design.md's Vercel-guidelines floor.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171b16; --soft:#454f47; --muted:#7d867d;
    --paper:#eef0e8; --paper-deep:#e4e7dc; --card:#fbfbf8; --line:#dcdfd3;
    --accent:#1f5c4d; --accent-ink:#0f382e; --accent-soft:#dfeae4;
    --amber:#a8632a; --amber-soft:#f3e6d5;
    --shadow-1:0 1px 2px rgba(23,27,22,.06), 0 1px 1px rgba(23,27,22,.04);
    --shadow-2:0 6px 18px rgba(23,27,22,.08), 0 2px 6px rgba(23,27,22,.05);
    --shadow-3:0 18px 44px rgba(23,27,22,.14), 0 6px 16px rgba(23,27,22,.08);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --ease:cubic-bezier(.22,.7,.25,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;
    background:
      radial-gradient(circle at 12% 8%, rgba(31,92,77,.05), transparent 42%),
      radial-gradient(circle at 92% 90%, rgba(168,99,42,.05), transparent 46%),
      var(--paper);
  }
  ::selection{background:var(--accent);color:#fff}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }

  /* ===== App shell ===== */
  .app{display:flex;flex-direction:column;height:100vh;max-width:1180px;margin:0 auto;width:100%}
  .topbar{display:flex;align-items:center;gap:14px;padding:20px 26px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--soft);letter-spacing:.01em}
  .brand b{font-family:var(--serif);font-weight:650;font-size:16px;color:var(--ink)}
  .brand .m{width:20px;height:20px;border-radius:6px;background:var(--accent)}
  .brand b{color:var(--ink)}

  /* ===== Folder tabs — literal tab-and-rail metaphor ===== */
  .tabbar{position:relative;padding:16px 22px 0}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:relative}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
    background:var(--paper-deep);border:1px solid var(--line);border-bottom:none;
    padding:12px 19px 15px;cursor:pointer;white-space:nowrap;
    clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 100%,0 100%);
    position:relative;top:2px;transition:top .2s var(--ease),color .2s ease,background .2s ease;
  }
  .tab:hover{color:var(--soft);top:0}
  .tab.on{background:var(--card);color:var(--ink);top:0;box-shadow:var(--shadow-1);z-index:2}
  .tab .n{
    display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
    border-radius:5px;background:var(--line);color:var(--muted);font-size:10.5px;font-weight:700;
    margin-right:8px;font-variant-numeric:tabular-nums;transition:background .2s ease,color .2s ease;
  }
  .tab.on .n{background:var(--accent);color:#fff}
  .rail{height:3px;background:var(--line);border-radius:99px;margin-top:-1px;position:relative;overflow:hidden;z-index:1}
  .rail::after{
    content:"";position:absolute;top:0;bottom:0;left:0;width:calc(100% / var(--count,6));background:var(--accent);
    border-radius:99px;transition:transform .32s var(--ease);
    transform:translateX(calc(var(--pos,0) * 100%));
  }

  /* ===== Sheet viewport ===== */
  .viewport{flex:1;position:relative;background:var(--card);overflow:hidden;box-shadow:var(--shadow-2);z-index:1}
  .sheet{
    position:absolute;inset:0;overflow-y:auto;padding:42px 48px 110px;
    transform:translateX(28px);opacity:0;pointer-events:none;
    transition:transform .34s var(--ease), opacity .24s ease;
  }
  .sheet.on{transform:translateX(0);opacity:1;pointer-events:auto}
  .sheet.left{transform:translateX(-28px)}
  @media(max-width:640px){.sheet{padding:28px 20px 110px}}

  h1{font-family:var(--serif);font-weight:560;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.015em;line-height:1.12;color:var(--ink)}
  h2{font-family:var(--serif);font-weight:560;font-size:20px;letter-spacing:-.005em;margin:32px 0 14px;display:flex;align-items:center;gap:11px;color:var(--ink)}
  h2:first-of-type{margin-top:8px}
  h2 .ix{width:27px;height:27px;border-radius:8px;background:var(--accent);color:#fff;font-family:var(--serif);font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow-1)}
  h3{font-family:var(--serif);font-weight:560}
  .kicker{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:5px 13px;border-radius:999px}
  .lead{color:var(--soft);font-size:16.5px;margin-top:14px;max-width:70ch;line-height:1.65}
  .max{max-width:760px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow-1)}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:18px 20px;transition:box-shadow .2s ease,transform .2s ease}
  .box:hover{box-shadow:var(--shadow-1);transform:translateY(-1px)}
  .box h3{font-size:15.5px;margin-bottom:6px}
  .box p{font-size:14.5px;color:var(--soft);line-height:1.55}

  ul.plain{list-style:none;margin-top:10px}
  ul.plain li{position:relative;padding:8px 0 8px 22px;font-size:15px;color:var(--soft);border-bottom:1px dashed var(--line)}
  ul.plain li:last-child{border:none}
  ul.plain li::before{content:"";position:absolute;left:0;top:16px;width:7px;height:7px;border-radius:2px;background:var(--accent)}

  table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  td:first-child{font-weight:600}
  tr:hover td{background:var(--paper)}

  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;margin-left:6px;vertical-align:middle;white-space:nowrap;letter-spacing:.01em}
  .t-u{background:var(--amber-soft);color:var(--amber)}
  .t-d{background:var(--accent-soft);color:var(--accent-ink)}
  .t-j{background:#e7e9de;color:var(--soft)}
  .legend{font-size:12.5px;color:var(--muted);margin-top:14px}
  .legend span{margin-right:14px}

  /* checklist */
  .clist{list-style:none;margin-top:8px}
  .citem{display:flex;align-items:flex-start;gap:12px;padding:12px 6px;border-bottom:1px dashed var(--line);font-size:15px;color:var(--soft);border-radius:8px;transition:background .15s ease}
  .citem:hover{background:var(--paper)}
  .citem:last-child{border-bottom:1px dashed var(--line)}
  .citem input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
  .citem label{cursor:pointer;flex:1;transition:color .2s ease}
  .citem.done label{color:var(--muted);text-decoration:line-through}
  .grp{margin-top:28px}
  .grp h3{font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .grp .cnt{font-family:var(--font);font-size:11.5px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}

  /* questions */
  .qgroup{margin-top:24px}
  .qgroup h3{font-size:15.5px;display:flex;align-items:center;gap:9px}
  .qgroup .badge{font-family:var(--font);font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
  .badge.b1{background:#f7ddd6;color:#a5432b}
  .badge.b2{background:var(--amber-soft);color:var(--amber)}
  .badge.b3{background:var(--accent-soft);color:var(--accent-ink)}
  .qlist{list-style:none;margin-top:10px}
  .qlist li{position:relative;padding:9px 0 9px 24px;font-size:15px;color:var(--soft);border-bottom:1px dashed var(--line)}
  .qlist li:last-child{border:none}
  .qlist li::before{content:"?";position:absolute;left:0;top:6px;color:var(--accent);font-weight:800;font-size:14px;font-family:var(--serif)}
  .qnote{font-size:13.5px;color:var(--muted);margin-top:14px}

  .now{background:linear-gradient(165deg,#1c2119,var(--ink));color:#eef0ee;border-radius:16px;padding:26px 28px;margin-top:28px;box-shadow:var(--shadow-3)}
  .now h2{color:#fff;margin-top:0}
  .now h2 .ix{background:#fff;color:var(--ink);box-shadow:none}
  .now ol{margin:6px 0 0 20px}
  .now li{padding:7px 0;font-size:15.5px;color:#cdd5c9}
  .now li b{color:#fff}

  .define{margin-top:16px;background:var(--paper);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:14px 18px;font-size:14.5px;color:var(--soft)}
  .define b{color:var(--ink)}

  .beforeafter{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-top:20px}
  @media(max-width:640px){.beforeafter{grid-template-columns:1fr}}
  .ba{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
  .ba .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .ba.after{background:var(--accent-soft);border-color:#c9dcd1}
  .arrow{font-size:22px;color:var(--accent);text-align:center;font-family:var(--serif)}

  /* ===== bottom bar (buttons) ===== */
  .bottombar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--paper)}
  .navbtns{display:flex;gap:8px}
  .navbtns button{
    background:var(--card);border:1px solid var(--line);color:var(--soft);
    font-family:inherit;font-weight:700;font-size:13px;padding:10px 17px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:box-shadow .15s ease,color .15s ease,transform .1s ease;
    box-shadow:var(--shadow-1);
  }
  .navbtns button:hover:not(:disabled){color:var(--accent-ink);box-shadow:var(--shadow-2);transform:translateY(-1px)}
  .navbtns button:active:not(:disabled){transform:translateY(0)}
  .navbtns button:disabled{opacity:.35;cursor:default;box-shadow:none}
  .progress{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .swipehint{font-size:11.5px;color:var(--muted)}
  @media(max-width:640px){.swipehint{display:none}}

  /* ===== Notes widget (floating, bottom-right) ===== */
  .notes-fab{
    position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-3);cursor:pointer;z-index:100;transition:transform .15s var(--ease),box-shadow .15s ease;
  }
  .notes-fab:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 22px 50px rgba(23,27,22,.2),var(--shadow-2)}
  .notes-fab svg{width:22px;height:22px}
  .notes-fab .cnt{
    position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 4px;border-radius:9px;
    background:var(--amber);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;
    justify-content:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .notes-fab .cnt.zero{display:none}

  .notes-panel{
    position:fixed;right:22px;bottom:86px;width:346px;max-height:min(560px,72vh);
    background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-3);
    display:flex;flex-direction:column;overflow:hidden;z-index:99;transform-origin:bottom right;
    transform:scale(.94) translateY(10px);opacity:0;pointer-events:none;
    transition:transform .22s var(--ease),opacity .18s ease;
  }
  .notes-panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
  @media(max-width:480px){.notes-panel{width:calc(100vw - 30px);right:15px;bottom:82px}}

  .notes-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
  .notes-head h4{font-family:var(--serif);font-weight:650;font-size:15.5px;color:var(--ink)}
  .notes-head .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .notes-head .acts{display:flex;gap:6px}
  .iconbtn{
    width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:16px;font-weight:700;line-height:1;transition:background .15s ease,color .15s ease;flex:0 0 auto;
  }
  .iconbtn:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .iconbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .note-form{padding:13px 16px;border-bottom:1px solid var(--line);background:var(--paper);display:none}
  .note-form.open{display:block}
  .note-form input[type=text]{
    width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;margin-bottom:8px;background:var(--card);color:var(--ink)
  }
  .note-form textarea{
    width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;min-height:64px;resize:vertical;background:var(--card);color:var(--ink);line-height:1.5
  }
  .note-form .row{display:flex;gap:8px;margin-top:8px}
  .micbtn{
    width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    color:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
    transition:background .15s ease,color .15s ease;
  }
  .micbtn svg{width:16px;height:16px}
  .micbtn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent-ink)}
  .micbtn:disabled{opacity:.3;cursor:not-allowed}
  .micbtn.rec{background:#f7ddd6;color:#a5432b;border-color:#f0c3b8;animation:micpulse 1.1s infinite}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(165,67,43,.3)}50%{box-shadow:0 0 0 7px rgba(165,67,43,0)}}
  .savebtn{
    flex:1;background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;
    font-weight:700;font-size:13.5px;cursor:pointer;transition:background .15s ease;
  }
  .savebtn:hover{background:var(--accent-ink)}

  .notes-body{flex:1;overflow-y:auto;padding:12px 14px}
  .notes-empty{font-size:13px;color:var(--muted);text-align:center;padding:34px 12px;line-height:1.5}
  .note-item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
  .note-item .subj{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);
    background:var(--accent-soft);padding:2px 9px;border-radius:999px;display:inline-block;
  }
  .note-item .txt{font-size:13.5px;color:var(--soft);margin-top:7px;line-height:1.5;white-space:pre-wrap}
  .note-item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .note-item .ts{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .note-item .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;padding:2px 4px}
  .note-item .del:hover{color:#a5432b}
  .note-item.flash{animation:flashnote 1.3s ease}
  @keyframes flashnote{0%{background:var(--accent-soft);border-color:#bcd8ca}100%{background:var(--paper);border-color:var(--line)}}
  .note-item .linked-ref{
    margin-top:7px;font-size:12px;color:var(--accent-ink);background:var(--card);border:1px dashed #bcd8ca;
    border-radius:7px;padding:5px 9px;line-height:1.4;
  }
  .notes-warn{font-size:11px;color:var(--amber);margin-top:2px}

  /* linked-item chip in the add-note form */
  .linked-chip{
    display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);
    border:1px solid #bcd8ca;border-radius:8px;padding:7px 10px;margin-bottom:8px;font-size:12.5px;color:var(--accent-ink);
  }
  .linked-chip .chip-txt{flex:1;line-height:1.4}
  .linked-chip .chip-x{background:none;border:none;color:var(--accent-ink);font-size:15px;font-weight:700;cursor:pointer;line-height:1;padding:0 2px}
  .linked-chip .chip-x:hover{color:#a5432b}
  #noteText{overflow-y:auto;max-height:260px;transition:height .1s ease}

  /* drag-to-attach affordance across the plan's numbered items */
  .dnd-item{position:relative;cursor:grab;padding-left:30px !important}
  .dnd-item::before{content:none !important}
  .dnd-item .dnum{
    position:absolute;left:0;top:9px;width:20px;height:20px;border-radius:6px;background:var(--line);
    color:var(--muted);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;transition:background .15s ease,color .15s ease;
  }
  .dnd-item:hover .dnum{background:var(--accent);color:#fff}
  .dnd-item.dragging{opacity:.4}
  li.citem.dnd-item{padding-left:0 !important}
  li.citem.dnd-item .dnum{position:static;margin-top:2px}

  .addnote-btn{
    width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:15px;font-weight:700;line-height:1;flex:0 0 auto;padding:0;
    transition:background .15s ease,color .15s ease,border-color .15s ease,transform .1s ease;
  }
  .addnote-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.08)}
  .addnote-btn:active{transform:scale(.96)}
  li.citem.dnd-item .addnote-btn{margin-left:auto}
  li:not(.citem).dnd-item{padding-right:36px}
  li:not(.citem).dnd-item .addnote-btn{position:absolute;right:0;top:7px}
  .notes-fab.drag-over{transform:scale(1.12);box-shadow:0 0 0 6px var(--accent-soft),var(--shadow-3)}
  .notes-panel.drag-over{outline:2.5px dashed var(--accent);outline-offset:-2px}
  .drag-tip{font-size:10.5px;color:var(--muted);margin-top:2px}

  /* ===== My Notes review tab ===== */
  .review-toolbar{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
  .review-toolbar input{
    flex:1;min-width:200px;font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow-1);
  }
  .review-toolbar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .exportbtn{
    background:var(--card);border:1px solid var(--line);color:var(--soft);font-family:inherit;
    font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:10px;cursor:pointer;
    box-shadow:var(--shadow-1);transition:box-shadow .15s ease,color .15s ease;white-space:nowrap;
  }
  .exportbtn:hover{color:var(--accent-ink);box-shadow:var(--shadow-2)}
  .review-body{margin-top:20px}
  .review-empty{
    text-align:center;color:var(--muted);font-size:15px;padding:60px 20px;background:var(--paper);
    border:1px dashed var(--line);border-radius:14px;line-height:1.6;
  }
  .review-count{font-size:12.5px;color:var(--muted);margin-bottom:12px;font-weight:600}
  .review-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;

{ id:'plan', label:'The Plan', html:`
  <span class="kicker">Overview</span>
  <h1>High Level</h1>
  <p class="lead">A specialist firm for finance-heavy and operationally messy businesses. We combine
    real accounting and business analysis with AI systems and workflow automation — so the technology
    solves a problem that actually exists, not a generic one. “High Level” is our working name for now;

  <div class="grid g2">
    <div class="box"><h3>The finance edge</h3><p>Reading accounts and filings, spotting where a
      business is weak or wasteful, and judging whether fixing it is actually worth money. Rare, and
      hard to fake.</p></div>
    <div class="box"><h3>The systems edge</h3><p>Designing and building the software, automations, and
      AI tools that turn a diagnosed problem into a working fix a team can use every day.</p></div>
  </div>
  <p class="lead">Most “AI agencies” sell technology looking for a problem. We do the opposite —
    understand the business first, then build.</p>

  <h2><span class="ix">2</span>Who we help</h2>
  <div class="grid g3">
    <div class="box"><h3>Finance-heavy firms</h3><p>Accountancy practices and finance teams stuck in
      manual month-end, reconciliation, and repetitive client work.</p></div>
    <div class="box"><h3>Reporting-heavy businesses</h3><p>Where decisions wait on slow reports that
      are easy to get wrong.</p></div>
    <div class="box"><h3>Operationally messy SMEs</h3><p>Growing companies run on spreadsheets,
      inboxes, and what's in people's heads.</p></div>
  </div>

  <h2><span class="ix">3</span>What "AI systems" actually means</h2>
  <p class="lead">Forget the hype — it means taking hours of repetitive manual work and letting
    software do it reliably, with a person still in charge.</p>
  <div class="beforeafter">
    <div class="ba"><div class="lbl">Before</div><p style="margin-top:8px;font-size:14.5px">A junior
      spends 2 days a month pulling numbers from emails and spreadsheets into a report — and sometimes
      gets it wrong.</p></div>
    <div class="arrow">→</div>
    <div class="ba after"><div class="lbl">After</div><p style="margin-top:8px;font-size:14.5px">A
      system gathers the numbers automatically and drafts the report in minutes. The junior checks and
      approves it.</p></div>
  </div>
  <div class="define"><b>Two terms, one line each:</b> an <b>automation</b> is a set task the computer

{ id:'foundations', label:'Foundations', html:`
  <span class="kicker">Positioning &amp; principles</span>
  <h1>What kind of firm this is — on purpose.</h1>
  <p class="lead">Before the how, the what: how we describe ourselves, and the rules we hold to so
    the firm doesn't drift into being "just another AI agency."</p>

  <h2><span class="ix">1</span>How we describe ourselves</h2>
  <p class="lead">Not a final name — a positioning statement to pick from together. Any of these reads

  <div class="grid g3">

    <div class="box"><h3>A specialist firm for workflow &amp; reporting improvement</h3><p>Leads with

  </div>
  <p class="lead" style="margin-top:16px">At the start, we should not present as a broad "AI for
    everyone" agency — a focused operator earns trust faster than a generalist, and can widen later.</p>

  <h2><span class="ix">2</span>The working principles</h2>
  <ul class="plain">
    <li>Start with real business problems, not AI hype.</li>
    <li>Treat public financial analysis as an informed hypothesis, not final truth — confirm it in
      conversation before acting on it.</li>
    <li>Keep domain truth (what's real, what's worth doing) and system truth (what gets built)
      separate — then join them deliberately at solution design.</li>
    <li>Track every project so it creates reusable knowledge, not just a one-off outcome.</li>
    <li>Stay focused enough to build credibility, flexible enough to learn from the market.</li>

  <div class="now" style="margin-top:30px">
    <h2 style="margin-top:0"><span class="ix">✓</span>In one paragraph</h2>

const tagClass = t => t==='u' ? 't-u' : t==='d' ? 't-d' : 't-j';
const tagLabel = t => t==='u' ? 'Utba' : t==='d' ? 'David' : 'Joint';

/* dragstart on any numbered item — carries its group + text so a drop on the notes
   widget can attach the note directly to this specific line */
function dragifyItem(el, groupLabel, text){
  el.classList.add('dnd-item');
  el.draggable = true;
  const fullRef = groupLabel + ' — ' + text;
  el.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', fullRef);
    e.dataTransfer.effectAllowed = 'copy';
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', ()=> el.classList.remove('dragging'));

  /* + button — same attach-to-note action as a drag-drop, works on touch/mobile too */
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'addnote-btn';
  btn.textContent = '+';
  btn.setAttribute('aria-label', 'Add this to notes');
  btn.title = 'Add this to notes';
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    window.dispatchEvent(new CustomEvent('hl:attach-note', { detail: { text: fullRef } }));
  });
  el.appendChild(btn);
}

function renderChecklist(containerId, items, storeKey, groupLabel){
  const ul = document.getElementById(containerId);
  if(!ul) return;
  items.forEach((item, idx) => {
    const [text, ...owners] = item;
    const key = storeKey+'_'+idx;
    const li = document.createElement('li');
    li.className = 'citem';
    const checked = localStorage.getItem(key) === '1';
    if(checked) li.classList.add('done');
    const ownerTags = owners.filter(Boolean).map(o=>`<span class="tag ${tagClass(o)}">${tagLabel(o)}</span>`).join('');
    li.innerHTML = `<span class="dnum">${idx+1}</span>
      <input type="checkbox" id="${key}" ${checked?'checked':''}>
      <label for="${key}">${text}${ownerTags}</label>`;
    li.querySelector('input').addEventListener('change', e=>{
      localStorage.setItem(key, e.target.checked ? '1':'0');
      li.classList.toggle('done', e.target.checked);
    });
    dragifyItem(li, groupLabel, text);
    ul.appendChild(li);
  });
}

function renderQuestions(containerId, items, groupLabel){
  const ul = document.getElementById(containerId);
  if(!ul) return;
  items.forEach((q, idx)=>{
    const li=document.createElement('li');
    li.innerHTML = `<span class="dnum">${idx+1}</span><span class="qtxt">${q}</span>`;
    dragifyItem(li, groupLabel, q);
    ul.appendChild(li);
  });
}

/* number + dragify the static Plan-of-Work phase lists (no JS render loop — walk the DOM) */
function dragifyStaticLists(sheetEl, groupPrefix){
  if(!sheetEl) return;
  sheetEl.querySelectorAll('h2').forEach(h2=>{
    const list = h2.nextElementSibling;
    if(!list || list.tagName !== 'UL' || !list.classList.contains('plain')) return;
    const label = groupPrefix + ' · ' + h2.textContent.trim().replace(/^\d+/, '').trim();
    [...list.children].forEach((li, idx)=>{
      const text = li.textContent.trim();
      li.innerHTML = `<span class="dnum">${idx+1}</span>` + li.innerHTML;
      dragifyItem(li, label, text);
    });
  });
}

let cur = 0;
const tabs = [...document.querySelectorAll('.tab')];
const sheets = [...document.querySelectorAll('.sheet')];

const nextBtn = document.getElementById('nextBtn');
const progress = document.getElementById('progress');

rail.style.setProperty('--count', SHEETS.length);

function go(i){
  i = Math.max(0, Math.min(SHEETS.length-1, i));
  sheets.forEach((s,x)=>{
    s.classList.remove('on','left');
    if(x===i) s.classList.add('on');
    else if(x<i) s.classList.add('left');
  });
  tabs.forEach((t,x)=>t.classList.toggle('on', x===i));
  cur = i;
  prevBtn.disabled = cur===0;
  nextBtn.disabled = cur===SHEETS.length-1;
  progress.textContent = (cur+1)+' / '+SHEETS.length+' — '+SHEETS[cur].label;
  rail.style.setProperty('--pos', cur);
  vp.scrollTop = 0;
  sheets[i].scrollTop = 0;
}
prevBtn.onclick = ()=>go(cur-1);
nextBtn.onclick = ()=>go(cur+1);
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag==='input' || tag==='textarea' || e.target.isContentEditable) return;
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});

/* swipe */
let touchX=null;
vp.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; }, {passive:true});
vp.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 60){ dx < 0 ? go(cur+1) : go(cur-1); }
  touchX = null;
}, {passive:true});

go(0);

  whoSwitch.addEventListener('click', pickWho);
  renderWho();

  /* local cache = instant paint + offline fallback; Supabase = source of truth, synced live */
  function loadCache(){
    try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || []; }
    catch(e){ storageOK = false; return []; }
  }
  function saveCache(list){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); }
    catch(e){ storageOK = false; }
  }
  let notes = loadCache();

  function mapRow(r){
    return { id: r.id, subject: r.subject, text: r.body, linkedTo: r.linked_ref, author: r.author, ts: new Date(r.created_at).getTime() };
  }

  async function fetchNotes(){
    try {
      const res = await fetch(REST + '?select=*&order=created_at.asc', { headers: sbHeaders });
      if(!res.ok) throw new Error('fetch failed');
      const rows = await res.json();
      notes = rows.map(mapRow);
      syncOK = true;
      saveCache(notes);
      render();
    } catch(e){
      syncOK = false;
      render();
    }
  }

  async function insertNote(payload){
    const res = await fetch(REST, {
      method: 'POST',
      headers: Object.assign({}, sbHeaders, { Prefer: 'return=representation' }),
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('insert failed');
    return res.json();
  }

  async function deleteNote(id){
    const res = await fetch(REST + '?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: sbHeaders
    });
    if(!res.ok) throw new Error('delete failed');
  }

  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' +
      d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }

  function render(justSavedId){
    cntEl.textContent = notes.length;
    cntEl.classList.toggle('zero', notes.length===0);
    const warn = !syncOK ? '<div class="notes-warn">Can\'t reach the shared note store right now — showing last synced copy. Notes you add will retry.</div>' : (!storageOK ? '<div class="notes-warn">Browser storage is blocked — notes will only last this session.</div>' : '');
    if(notes.length===0){
      bodyEl.innerHTML = warn + '<div class="notes-empty">No notes yet. Tap <b>+</b> to jot down something<br>specific or general — or drag a numbered item in.</div>';
      return;

    bodyEl.innerHTML = warn + notes.slice().reverse().map(n => `
      <div class="note-item" data-id="${n.id}">
        <span class="subj">${escapeHtml(n.subject || 'General')}${n.author ? ` · <span style="font-weight:500;color:var(--muted)">${n.author === 'david' ? 'David' : n.author === 'utba' ? 'Utba' : escapeHtml(n.author)}</span>` : ''}</span>
        <div class="txt">${escapeHtml(n.text)}</div>
        ${n.linkedTo ? `<div class="linked-ref">🔗 ${escapeHtml(n.linkedTo)}</div>` : ''}
        <div class="meta"><span class="ts">${fmtTime(n.ts)}</span><button class="del" data-del="${n.id}">Delete</button></div>
      </div>`).join('');
    bodyEl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.getAttribute('data-del');
        notes = notes.filter(n => String(n.id) !== id);
        saveCache(notes); render();
        try { await deleteNote(id); } catch(e){ fetchNotes(); }
      });

    if(justSavedId){
      const el = bodyEl.querySelector(`[data-id="${justSavedId}"]`);

  /* ===== My Notes review tab — full list, searchable, exportable ===== */
  const reviewBody = document.getElementById('notesReviewBody');

  const exportBtn = document.getElementById('notesExportBtn');

  function renderReview(){
    if(!reviewBody) return;
    const q = (reviewSearch && reviewSearch.value.trim().toLowerCase()) || '';
    let list = notes.slice().reverse();
    if(q){
      list = list.filter(n =>
        (n.text||'').toLowerCase().includes(q) ||
        (n.subject||'').toLowerCase().includes(q) ||
        (n.linkedTo||'').toLowerCase().includes(q)

      if(n.linkedTo) lines.push('Linked to: ' + n.linkedTo);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });
  document.addEventListener('click', e=>{
    if(panel.classList.contains('open') && !panel.contains(e.target) && !fab.contains(e.target)) closePanel();
  });

  addBtn.addEventListener('click', ()=>{
    if(!panel.classList.contains('open')) openPanel();
    form.classList.toggle('open');
    addBtn.classList.toggle('active', form.classList.contains('open'));
    if(form.classList.contains('open')) subjectInput.focus();
  });

  async function addNote(){
    const text = textInput.value.trim();
    if(!text) { textInput.focus(); return; }
    if(!getWho()){ pickWho(); if(!getWho()) return; }
    const tempId = 'temp-' + Date.now();
    const subject = subjectInput.value.trim() || 'General';
    const linked = linkedItemText;
    notes.push({ id: tempId, subject, text, linkedTo: linked, author: getWho(), ts: Date.now() });
    saveCache(notes);
    subjectInput.value = ''; textInput.value = ''; textInput.style.height = '';
    linkedItemText = null; renderChip();
    form.classList.remove('open'); addBtn.classList.remove('active');
    render(tempId);
    try {
      await insertNote({ author: getWho(), subject, body: text, linked_ref: linked });
      await fetchNotes();
    } catch(e){
      syncOK = false; render();
    }
  }
  saveBtn.addEventListener('click', addNote);
  textInput.addEventListener('keydown', e=>{
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter') addNote();
  });
  textInput.addEventListener('input', ()=>{
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 260) + 'px';
  });

  /* shared by both attach paths: dragging an item onto the widget, or tapping its + button */
  function attachLinkedNote(text){
    if(!text) return;
    linkedItemText = text;
    openPanel();
    form.classList.add('open'); addBtn.classList.add('active');
    renderChip();
    textInput.focus();
  }
  window.addEventListener('hl:attach-note', e => attachLinkedNote(e.detail && e.detail.text));

  /* drag-to-attach: drop a numbered item from the plan onto the widget to link a note to it */
  [fab, panel].forEach(zone=>{
    zone.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      attachLinkedNote(e.dataTransfer.getData('text/plain'));
    });
  });

  /* Speech-to-text — Web Speech API, graceful fallback if unsupported */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false, recognizer = null;
  if(!SR){
    micBtn.disabled = true;
    micBtn.title = 'Voice input isn\'t supported in this browser — try Chrome or Edge.';
  } else {
    recognizer = new SR();
    recognizer.continuous = true;
    recognizer.interimResults = true;
    recognizer.lang = 'en-GB';
    let baseText = '';
    recognizer.addEventListener('start', ()=>{ recognizing = true; micBtn.classList.add('rec'); baseText = textInput.value; });
    recognizer.addEventListener('end', ()=>{ recognizing = false; micBtn.classList.remove('rec'); });
    recognizer.addEventListener('error', ()=>{ recognizing = false; micBtn.classList.remove('rec'); });
    recognizer.addEventListener('result', e=>{
      let transcript = '';
      for(let i=0;i<e.results.length;i++) transcript += e.results[i][0].transcript;
      textInput.value = (baseText ? baseText + ' ' : '') + transcript;
    });
    micBtn.addEventListener('click', ()=>{
      if(recognizing){ recognizer.stop(); return; }
      try { recognizer.start(); } catch(e){ /* already started */ }
    });
  }

  renderChip();
  render();
  fetchNotes();
  setInterval(()=>{ if(panel.classList.contains('open')) fetchNotes(); }, 8000);
})();
</script>
</body>
</html>
